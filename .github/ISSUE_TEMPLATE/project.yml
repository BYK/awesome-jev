name: Suggest a project
description: Suggest a public Jev project for inclusion
title: "Add: "
labels:
  - project suggestion
body:
  - type: input
    id: project
    attributes:
      label: Project URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: What does Jev decide?
      description: Describe the typed decision and how the application uses it.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: Link to the source file, documentation, demo, or evaluation that shows Jev usage.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Your relationship to the project
      options:
        - I maintain or built it
        - I contributed to it
        - I am not affiliated
    validations:
      required: true
